<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePe Merchant QR Generate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5f259f, #7b2cbf, #9d4edd);
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 8px; color: #5f259f; font-size: 25px; }
    .subtitle { margin: 0 0 22px; color: #666; font-size: 14px; }
    label {
      display: block; text-align: left; font-weight: bold;
      margin-bottom: 8px; color: #333;
    }
    .input-wrap {
      display: flex; align-items: center; border: 2px solid #ddd;
      border-radius: 12px; overflow: hidden; margin-bottom: 16px;
      background: #fafafa;
    }
    .fixed { padding: 13px 8px 13px 12px; color: #555; font-size: 14px; white-space: nowrap; }
    input {
      width: 100%; border: 0; outline: none; padding: 13px 6px;
      font-size: 16px; background: transparent;
    }
    .suffix { padding: 13px 12px 13px 5px; color: #555; font-size: 14px; white-space: nowrap; }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      margin-top: 4px; font-size: 16px; font-weight: bold; cursor: pointer;
      color: white; background: #5f259f;
    }
    button:hover { background: #4d1e82; }
    #resultBox { display: none; margin: 22px auto 15px; }
    #finalImage {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .download { display: none; background: #20a464; margin-top: 8px; }
    .download:hover { background: #17834e; }
    .note {
      display: none;
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }
    #qrStage {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
    .footer { margin-top: 22px; font-size: 13px; color: #888; }
  </style>
</head>
<body>

  <div class="card">
    <h1>PhonePe Merchant QR Generate</h1>
    <p class="subtitle">Enter Merchant ID to generate UPI QR</p>

    <label for="merchantId">Merchant ID</label>

    <div class="input-wrap">
      <span class="fixed">upi://pay?pa=Q</span>
      <input id="merchantId" type="text" placeholder="359769873" autocomplete="off">
      <span class="suffix">@ybl</span>
    </div>

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="resultBox">
      <img id="finalImage" alt="PhonePe Merchant QR">
    </div>

    <button id="downloadBtn" class="download" onclick="downloadQR()">
      Download QR Image
    </button>

    <div id="note" class="note">The supplied PhonePe format stays fixed; only the QR area is replaced.</div>

    <div class="footer">PhonePe Merchant QR Generator</div>
  </div>

  <div id="qrStage"></div>

  // Exact QR-area placement taken from the supplied format image.
  const QR_X = 71;
  const QR_Y = 615;
  const QR_W = 521;
  const QR_H = 539;

  let finalCanvas = null;

  function generateQR() {
    const rawId = document.getElementById("merchantId").value.trim();
    const merchantId = "Q" + rawId.replace(/^Q/i, "");

    if (!rawId) {
      alert("Please enter Merchant ID");
      return;
    }

    const upiLink = "upi://pay?pa=" + merchantId + "@ybl";

    const stage = document.getElementById("qrStage");
    stage.innerHTML = "";

    // Generate a high-resolution QR in a temporary area.
    const qrHolder = document.createElement("div");
    stage.appendChild(qrHolder);

    new QRCode(qrHolder, {
      text: upiLink,
      width: QR_W,
      height: QR_H,
      correctLevel: QRCode.CorrectLevel.H
    });

    const qrCanvas = qrHolder.querySelector("canvas");
    const qrImg = qrHolder.querySelector("img");

    const templateImg = new Image();
    templateImg.onload = function() {
      finalCanvas = document.createElement("canvas");
      finalCanvas.width = templateImg.naturalWidth;
      finalCanvas.height = templateImg.naturalHeight;

      const ctx = finalCanvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      // Draw the user's supplied format unchanged.
      ctx.drawImage(templateImg, 0, 0);

      // Cover only the old QR area with white.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(QR_X - 2, QR_Y - 2, QR_W + 4, QR_H + 4);

      // Put the newly generated QR in exactly the same area.
      if (qrCanvas) {
        ctx.drawImage(qrCanvas, QR_X, QR_Y, QR_W, QR_H);
      } else if (qrImg) {
        const drawQRImage = () => {
          ctx.drawImage(qrImg, QR_X, QR_Y, QR_W, QR_H);
          drawDynamicUpiId(ctx, merchantId);
          showResult();
        };
        if (qrImg.complete) drawQRImage();
        else qrImg.onload = drawQRImage;
        return;
      }

      drawDynamicUpiId(ctx, merchantId);
      showResult();
    };

    templateImg.src = TEMPLATE_IMAGE;
  }

  function drawDynamicUpiId(ctx, merchantId) {
    const upiText = "UPI ID: " + merchantId + "@ybl";

    // Cover the old static UPI ID text only.
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(155, 1168, 353, 43);

    // Draw the new UPI ID generated from the entered Merchant ID.
    ctx.fillStyle = "#777777";
    ctx.font = "24px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(upiText, 331.5, 1189);
  }

  function showResult() {
    const finalImage = document.getElementById("finalImage");
    finalImage.src = finalCanvas.toDataURL("image/png");
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("downloadBtn").style.display = "block";
    document.getElementById("note").style.display = "block";
  }

  function downloadQR() {
    if (!finalCanvas) return;

    const a = document.createElement("a");
    a.href = finalCanvas.toDataURL("image/png");
    a.download = "PhonePe-Merchant-QR.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  document.getElementById("merchantId").addEventListener("keydown", function(e) {
    if (e.key === "Enter") generateQR();
  });
</script>
