<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePe Merchant QR Generate</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5f259f, #7b2cbf, #9d4edd);
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0 0 8px;
      color: #5f259f;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    input {
      width: 100%;
      border: 2px solid #ddd;
      outline: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #5f259f;
    }

    button:hover {
      background: #4d1e82;
    }

    .secondary {
      background: #777;
      margin-top: 10px;
    }

    .secondary:hover {
      background: #555;
    }

    #loginBox {
      display: block;
    }

    #qrPage {
      display: none;
    }

    #otpBox {
      display: none;
    }

    #qrBox {
      display: none;
      margin: 22px auto 15px;
      padding: 16px;
      width: fit-content;
      border: 1px solid #eee;
      border-radius: 14px;
      background: #fff;
    }

    #qrCode img,
    #qrCode canvas {
      display: block;
      margin: auto;
    }

    .upi-text {
      display: none;
      word-break: break-all;
      font-size: 12px;
      color: #555;
      margin: 10px 0;
    }

    .download {
      display: none;
      background: #20a464;
      margin-top: 8px;
    }

    .download:hover {
      background: #17834e;
    }

    .logout {
      font-size: 13px;
      padding: 10px;
      background: #777;
    }

    #recaptcha-container {
      margin: 10px 0;
    }

    .status {
      font-size: 13px;
      margin: 10px 0;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGIN -->

    <div id="loginBox">

      <h1>Merchant Login</h1>

      <p class="subtitle">
        Login with your mobile number
      </p>

      <label>Mobile Number</label>

      <input
        id="phoneNumber"
        type="tel"
        placeholder="+91XXXXXXXXXX"
        autocomplete="tel"
      >

      <div id="recaptcha-container"></div>

      <button id="sendOtpBtn">
        Send OTP
      </button>

      <div id="otpBox">

        <label style="margin-top:18px;">
          Enter OTP
        </label>

        <input
          id="otp"
          type="number"
          placeholder="Enter 6 digit OTP"
          autocomplete="one-time-code"
        >

        <button id="verifyOtpBtn">
          Verify OTP
        </button>

      </div>

      <div id="loginStatus" class="status"></div>

    </div>


    <!-- QR GENERATOR -->

    <div id="qrPage">

      <h1>QR Generate</h1>

      <p class="subtitle">
        Enter Merchant ID to generate UPI QR
      </p>

      <label for="merchantId">
        Merchant ID
      </label>

      <div style="display:flex;align-items:center;border:2px solid #ddd;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#fafafa;">

        <span style="padding:13px 8px 13px 12px;color:#555;font-size:14px;white-space:nowrap;">
          upi://pay?pa=
        </span>

        <input
          id="merchantId"
          type="text"
          placeholder="Q359769873"
          autocomplete="off"
          style="border:0;margin:0;background:transparent;"
        >

        <span style="padding:13px 12px 13px 5px;color:#555;font-size:14px;white-space:nowrap;">
          @ybl
        </span>

      </div>

      <button id="generateBtn">
        Generate QR Code
      </button>

      <div id="qrBox">
        <div id="qrCode"></div>
      </div>

      <div id="upiText" class="upi-text"></div>

      <button id="downloadBtn" class="download">
        Download QR Code
      </button>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDCCfFEe5-vaqXh57ok_RlqJtzmSgLtkOs",

      authDomain:
        "marchant-qr-gernate.firebaseapp.com",

      projectId:
        "marchant-qr-gernate",

      storageBucket:
        "marchant-qr-gernate.firebasestorage.app",

      messagingSenderId:
        "532197694237",

      appId:
        "1:532197694237:web:16730dbbe778f445c4dff4"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let confirmationResult;


    const loginBox =
      document.getElementById("loginBox");

    const qrPage =
      document.getElementById("qrPage");

    const loginStatus =
      document.getElementById("loginStatus");


    /* RECAPTCHA */

    window.recaptchaVerifier =
      new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal"
        }
      );


    /* SEND OTP */

    document
      .getElementById("sendOtpBtn")
      .addEventListener(
        "click",
        async function() {

          const phone =
            document
              .getElementById("phoneNumber")
              .value
              .trim();


          if (!phone) {

            loginStatus.textContent =
              "Please enter mobile number.";

            return;

          }


          try {

            loginStatus.textContent =
              "Sending OTP...";


            confirmationResult =
              await signInWithPhoneNumber(
                auth,
                phone,
                window.recaptchaVerifier
              );


            document
              .getElementById("otpBox")
              .style.display = "block";


            loginStatus.textContent =
              "OTP sent successfully.";

          } catch (error) {

            console.error(error);

            loginStatus.textContent =
              error.message;

          }

        }
      );


    /* VERIFY OTP */

    document
      .getElementById("verifyOtpBtn")
      .addEventListener(
        "click",
        async function() {

          const otp =
            document
              .getElementById("otp")
              .value
              .trim();


          if (!otp) {

            loginStatus.textContent =
              "Please enter OTP.";

            return;

          }


          try {

            loginStatus.textContent =
              "Verifying...";


            await confirmationResult.confirm(otp);


            loginStatus.textContent =
              "Login successful.";

          } catch (error) {

            console.error(error);

            loginStatus.textContent =
              "Invalid OTP.";

          }

        }
      );


    /* AUTH STATE */

    onAuthStateChanged(
      auth,
      function(user) {

        if (user) {

          loginBox.style.display =
            "none";

          qrPage.style.display =
            "block";

        } else {

          loginBox.style.display =
            "block";

          qrPage.style.display =
            "none";

        }

      }
    );


    /* GENERATE QR */

    document
      .getElementById("generateBtn")
      .addEventListener(
        "click",
        async function() {

          const merchantId =
            document
              .getElementById("merchantId")
              .value
              .trim();


          if (!merchantId) {

            alert(
              "Please enter Merchant ID"
            );

            return;

          }


          const upiLink =
            "upi://pay?pa=" +
            merchantId +
            "@ybl";


          document
            .getElementById("qrCode")
            .innerHTML = "";


          new QRCode(
            document.getElementById("qrCode"),
            {
              text: upiLink,
              width: 260,
              height: 260,
              correctLevel:
                QRCode.CorrectLevel.H
            }
          );


          document
            .getElementById("qrBox")
            .style.display = "block";


          document
            .getElementById("upiText")
            .style.display = "block";


          document
            .getElementById("upiText")
            .textContent =
              upiLink;


          document
            .getElementById("downloadBtn")
            .style.display = "block";


          /* SAVE USER + MERCHANT DATA */

          try {

            const user =
              auth.currentUser;


            await addDoc(
              collection(
                db,
                "merchant_qr"
              ),
              {

                merchantId:
                  merchantId,

                upiId:
                  merchantId + "@ybl",

                upiLink:
                  upiLink,

                userId:
                  user.uid,

                userPhone:
                  user.phoneNumber,

                createdAt:
                  serverTimestamp()

              }
            );

            console.log(
              "Data saved to Firebase"
            );

          } catch (error) {

            console.error(
              "Firebase error:",
              error
            );

          }

        }
      );


    /* ENTER KEY */

    document
      .getElementById("merchantId")
      .addEventListener(
        "keydown",
        function(e) {

          if (e.key === "Enter") {

            document
              .getElementById("generateBtn")
              .click();

          }

        }
      );


    /* DOWNLOAD QR */

    document
      .getElementById("downloadBtn")
      .addEventListener(
        "click",
        function() {

          const canvas =
            document.querySelector(
              "#qrCode canvas"
            );

          const img =
            document.querySelector(
              "#qrCode img"
            );


          const url =
            canvas
              ? canvas.toDataURL("image/png")
              : img.src;


          const a =
            document.createElement("a");


          a.href = url;

          a.download =
            "PhonePe-Merchant-QR.png";


          document
            .body
            .appendChild(a);


          a.click();


          document
            .body
            .removeChild(a);

        }
      );


    /* LOGOUT */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          await signOut(auth);

        }
      );

  </script>

</body>
</html>
