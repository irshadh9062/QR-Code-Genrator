<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePe Merchant QR Generate</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #5f259f, #7b2cbf, #9d4edd);
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }
    h1 {
      margin: 0 0 8px;
      color: #5f259f;
      font-size: 25px;
    }
    .subtitle {
      margin: 0 0 22px;
      color: #666;
      font-size: 14px;
    }
    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      border: 2px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .fixed {
      padding: 13px 8px 13px 12px;
      color: #555;
      font-size: 14px;
      white-space: nowrap;
    }
    input {
      width: 100%;
      border: 0;
      outline: none;
      padding: 13px 6px;
      font-size: 16px;
      background: transparent;
    }
    .suffix {
      padding: 13px 12px 13px 5px;
      color: #555;
      font-size: 14px;
      white-space: nowrap;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #5f259f;
    }
    button:hover { background: #4d1e82; }
    #qrBox {
      display: none;
      margin: 22px auto 15px;
      padding: 16px;
      width: fit-content;
      border: 1px solid #eee;
      border-radius: 14px;
      background: #fff;
    }
    #qrCode img, #qrCode canvas {
      display: block;
      margin: auto;
    }
    .upi-text {
      display: none;
      word-break: break-all;
      font-size: 12px;
      color: #555;
      margin: 10px 0;
    }
    .download {
      display: none;
      background: #20a464;
      margin-top: 8px;
    }
    .download:hover { background: #17834e; }
    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>QR Generate</h1>
    <p class="subtitle">Enter Merchant ID to generate UPI QR</p>

    <label for="merchantId">Merchant ID</label>

    <div class="input-wrap">
      <span class="fixed">upi://pay?pa=</span>
      <input id="merchantId" type="text" placeholder="Q359769873" autocomplete="off">
      <span class="suffix">@ybl</span>
    </div>

    <button onclick="generateQR()">Generate QR Code</button>

    <div id="qrBox">
      <div id="qrCode"></div>
    </div>

    <div id="upiText" class="upi-text"></div>

    <button id="downloadBtn" class="download" onclick="downloadQR()">
      Download QR Code
    </button>

    
  </div>

<script>
  let qr;

  function generateQR() {
    const merchantId = document.getElementById("merchantId").value.trim();

    if (!merchantId) {
      alert("Please enter Merchant ID");
      return;
    }

    const upiLink = "upi://pay?pa=" + merchantId + "@ybl";

    document.getElementById("qrCode").innerHTML = "";

    qr = new QRCode(document.getElementById("qrCode"), {
      text: upiLink,
      width: 260,
      height: 260,
      correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById("qrBox").style.display = "block";
    document.getElementById("upiText").style.display = "block";
    document.getElementById("upiText").textContent = upiLink;
    document.getElementById("downloadBtn").style.display = "block";
  }

  function downloadQR() {
    const canvas = document.querySelector("#qrCode canvas");
    const img = document.querySelector("#qrCode img");

    let url = canvas ? canvas.toDataURL("image/png") : img.src;

    const a = document.createElement("a");
    a.href = url;
    a.download = "PhonePe-Merchant-QR.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  document.getElementById("merchantId").addEventListener("keydown", function(e) {
    if (e.key === "Enter") generateQR();
  });
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDCCfFEe5-vaqXh57ok_RlqJtzmSgLtkOs",
    authDomain: "marchant-qr-gernate.firebaseapp.com",
    projectId: "marchant-qr-gernate",
    storageBucket: "marchant-qr-gernate.firebasestorage.app",
    messagingSenderId: "532197694237",
    appId: "1:532197694237:web:16730dbbe778f445c4dff4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
</script>
</body>
</html>
